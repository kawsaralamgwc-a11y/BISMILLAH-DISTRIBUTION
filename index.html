<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<title>BS Dealer Pro — হিসাব</title>
<style>
:root{
  --bg:#0b1220;--bg2:#0f1a2e;--panel:#111e35;--panel2:#152442;--card:#13223d;
  --line:#22375e;--line2:#2c4472;
  --text:#eaf1ff;--muted:#8aa0c6;--muted2:#5f76a0;
  --brand:#3b82f6;--brand2:#60a5fa;
  --green:#22c58a;--greenbg:#0e2f27;
  --red:#f2555a;--redbg:#331420;
  --amber:#f5a524;--amberbg:#332615;
  --violet:#a78bfa;--violetbg:#241c3d;
  --cyan:#38bdf8;
  --radius:16px;--shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:radial-gradient(1200px 600px at 100% -10%,#16305e 0%,transparent 55%),
             radial-gradient(900px 500px at -10% 0%,#123 0%,transparent 45%),var(--bg);
  color:var(--text);-webkit-tap-highlight-color:transparent;min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--brand2)}
.hidden{display:none!important}

/* ---------- App shell ---------- */
.appbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background:linear-gradient(180deg,rgba(11,18,32,.96),rgba(11,18,32,.82));
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.appbar .logo{width:38px;height:38px;border-radius:11px;overflow:hidden;flex:0 0 auto;
  box-shadow:0 0 0 1px var(--line2);background:#fff}
.appbar .logo img{width:100%;height:100%;object-fit:cover}
.appbar .title{font-weight:800;font-size:16px;line-height:1.1}
.appbar .title small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.appbar .spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--line);font-size:18px}
.iconbtn:active{transform:scale(.94)}

.profilechip{display:flex;align-items:center;gap:6px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:6px 8px;max-width:150px}
.profilechip select{background:none;border:0;font-weight:700;max-width:110px;outline:none}

/* layout */
.shell{display:flex;min-height:100vh}
.drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:49;opacity:0;
  pointer-events:none;transition:.2s}
.drawer-scrim.open{opacity:1;pointer-events:auto}
.sidebar{
  position:fixed;z-index:50;top:0;left:0;height:100vh;width:264px;transform:translateX(-100%);
  transition:transform .25s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:0 10px 16px;overflow-y:auto;
}
.sidebar.open{transform:translateX(0)}
.sidebar .sbhead{padding:16px 8px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;
  background:linear-gradient(180deg,var(--bg2),rgba(15,26,46,.85));backdrop-filter:blur(6px)}
.sidebar .sbhead .logo{width:40px;height:40px;border-radius:12px;overflow:hidden;background:#fff}
.sidebar .sbhead .logo img{width:100%;height:100%;object-fit:cover}
.navgroup{margin-top:10px}
.navgroup .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);
  padding:8px 12px 4px;font-weight:800}
.navbtn{width:100%;text-align:left;display:flex;align-items:center;gap:11px;padding:11px 12px;
  border-radius:12px;color:var(--muted);font-weight:700;font-size:14.5px;margin:2px 0}
.navbtn .ic{width:22px;text-align:center;font-size:16px}
.navbtn:active{background:var(--panel)}
.navbtn.active{background:linear-gradient(90deg,rgba(59,130,246,.22),rgba(59,130,246,.05));
  color:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
.navbtn.active .ic{color:var(--brand2)}

.content{flex:1;min-width:0;padding:14px 14px 96px;max-width:920px;margin:0 auto;width:100%}

@media(min-width:900px){
  .drawer-scrim{display:none}
  .sidebar{transform:translateX(0);position:sticky}
  .menu-toggle{display:none}
  .content{padding:22px 26px 40px}
}

/* ---------- Bottom nav (mobile) ---------- */
.bottomnav{position:fixed;z-index:41;left:0;right:0;bottom:0;display:flex;
  padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);gap:2px;
  background:linear-gradient(180deg,rgba(11,18,32,.7),rgba(11,18,32,.98));
  backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:12px;color:var(--muted2);font-size:10.5px;font-weight:700}
.bottomnav button .ic{font-size:19px}
.bottomnav button.active{color:var(--brand2);background:rgba(59,130,246,.12)}
@media(min-width:900px){.bottomnav{display:none}.content{padding-bottom:40px}}

/* ---------- Reusable ---------- */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 14px;flex-wrap:wrap}
.pagehead h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.pagehead p{margin:3px 0 0;color:var(--muted);font-size:13px}

.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.subtle{color:var(--muted);font-size:13px}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:640px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}

.stat{background:linear-gradient(180deg,var(--card),#0f1c34);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px;position:relative;overflow:hidden}
.stat .k{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.stat .v{font-size:20px;font-weight:800;margin-top:8px;letter-spacing:-.02em;word-break:break-word}
.stat .sub{font-size:11px;color:var(--muted2);margin-top:3px}
.stat::after{content:"";position:absolute;right:-24px;top:-24px;width:70px;height:70px;border-radius:50%;
  background:var(--accent,#3b82f6);opacity:.14;filter:blur(2px)}
.stat.green{--accent:var(--green)} .stat.red{--accent:var(--red)}
.stat.blue{--accent:var(--brand)} .stat.amber{--accent:var(--amber)}
.stat.violet{--accent:var(--violet)} .stat.cyan{--accent:var(--cyan)}
.stat .v.green{color:var(--green)} .stat .v.red{color:var(--red)}

.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.input,select.input,textarea.input{width:100%;padding:12px 13px;border-radius:12px;
  background:var(--bg2);border:1px solid var(--line);outline:none;font-size:15px;transition:.15s}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
textarea.input{resize:vertical;min-height:52px}
.formgrid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.formgrid .full{grid-column:1/-1}
@media(max-width:520px){.formgrid{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;
  border-radius:12px;font-weight:800;font-size:14.5px;background:var(--panel);
  border:1px solid var(--line);transition:.15s}
.btn:active{transform:translateY(1px)}
.btn.block{width:100%}
.btn.primary{background:linear-gradient(180deg,var(--brand2),var(--brand));border-color:transparent;color:#04122b}
.btn.green{background:linear-gradient(180deg,#34d39b,var(--green));border-color:transparent;color:#042018}
.btn.red{background:linear-gradient(180deg,#ff6b70,var(--red));border-color:transparent;color:#2a0a0d}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 11px;font-size:12.5px;border-radius:10px}

.seg{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:5px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.active{background:var(--brand);color:#04122b}
.seg.green button.active{background:var(--green);color:#042018}
.seg.red button.active{background:var(--red);color:#2a0a0d}

.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  font-size:11.5px;font-weight:800;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.badge{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
.badge.in{background:var(--greenbg);color:var(--green)}
.badge.out{background:var(--redbg);color:var(--red)}
.badge.due{background:var(--amberbg);color:var(--amber)}
.badge.ok{background:var(--greenbg);color:var(--green)}

/* transaction list */
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:11px;padding:11px;border-radius:13px;
  background:var(--bg2);border:1px solid var(--line)}
.trow .ti{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.trow .ti.in{background:var(--greenbg);color:var(--green)}
.trow .ti.out{background:var(--redbg);color:var(--red)}
.trow .ti.tr{background:var(--violetbg);color:var(--violet)}
.trow .tm{flex:1;min-width:0}
.trow .tm .tt{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tm .ts{font-size:11.5px;color:var(--muted2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .ta{text-align:right;flex:0 0 auto}
.trow .ta .amt{font-weight:800;font-size:14.5px}
.trow .ta .amt.in{color:var(--green)} .trow .ta .amt.out{color:var(--red)}
.trow .ta .bal{font-size:10.5px;color:var(--muted2);margin-top:2px}
.rowacts{display:flex;gap:6px;margin-left:4px}
.rowacts button{width:30px;height:30px;border-radius:9px;background:var(--panel);border:1px solid var(--line);
  display:grid;place-items:center;font-size:13px}

.empty{text-align:center;color:var(--muted2);padding:26px 10px;font-size:13.5px}
.empty .em{font-size:34px;opacity:.5;margin-bottom:6px}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
table.tbl th,table.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
table.tbl th{background:var(--bg2);color:var(--muted);font-size:11.5px;font-weight:800;
  text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
table.tbl tr:last-child td{border-bottom:0}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl tfoot td{font-weight:800;background:var(--bg2)}

.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filterbar .input{padding:9px 11px;font-size:13.5px}
.filterbar .grow{flex:1;min-width:130px}

/* bars */
.bars{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.bar .bl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;font-weight:700}
.bar .track{height:9px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar .fill{height:100%;border-radius:99px}

/* modal */
.modal-scrim{position:fixed;inset:0;z-index:60;background:rgba(4,8,16,.65);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center}
.modal-scrim.open{display:flex}
.modal{width:100%;max-width:520px;background:linear-gradient(180deg,var(--panel),var(--bg2));
  border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px;
  max-height:92vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.5);
  animation:sheet .25s cubic-bezier(.4,0,.2,1)}
@media(min-width:640px){.modal-scrim{align-items:center}.modal{border-radius:20px}}
@keyframes sheet{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.modal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal .mh h3{margin:0;font-size:17px;font-weight:800}

/* toast */
.toast{position:fixed;z-index:80;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);
  background:var(--panel2);border:1px solid var(--line2);color:#fff;padding:11px 16px;border-radius:12px;
  font-weight:700;font-size:13.5px;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--red)}
@media(min-width:900px){.toast{bottom:28px}}

/* auth / lock */
.lockwrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(900px 500px at 50% -10%,#1b3a6e,transparent 60%),var(--bg)}
.lockbox{width:100%;max-width:360px;text-align:center}
.lockbox .lk{width:78px;height:78px;border-radius:22px;overflow:hidden;margin:0 auto 14px;background:#fff;
  box-shadow:0 0 0 1px var(--line2),0 18px 40px rgba(0,0,0,.4)}
.lockbox .lk img{width:100%;height:100%;object-fit:cover}
.lockbox h2{margin:0 0 4px;font-size:22px;font-weight:800}
.lockbox p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
.pindots{display:flex;justify-content:center;gap:12px;margin:18px 0}
.pindots .d{width:14px;height:14px;border-radius:50%;background:var(--panel);border:1px solid var(--line2);transition:.15s}
.pindots .d.on{background:var(--brand);border-color:var(--brand);transform:scale(1.1)}
.pinerr{color:var(--red);font-size:13px;font-weight:700;min-height:18px;margin-bottom:6px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:280px;margin:0 auto}
.keypad button{height:62px;border-radius:16px;font-size:24px;font-weight:800;background:var(--panel);
  border:1px solid var(--line)}
.keypad button:active{background:var(--panel2);transform:scale(.96)}
.keypad button.act{font-size:15px;color:var(--muted)}

.mtop{margin-top:14px}.mb0{margin-bottom:0}
.rowbetween{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pos{color:var(--green)}.neg{color:var(--red)}
.txtc{text-align:center}
.pillbtns{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>

<!-- ============ LOCK SCREEN ============ -->
<div id="lockScreen" class="lockwrap hidden">
  <div class="lockbox">
    <div class="lk"><img src="icon-192.png" alt="লোগো"></div>
    <h2 id="lockTitle">BS Dealer Pro</h2>
    <p id="lockSub">পিন দিয়ে আনলক করুন</p>
    <div class="pindots" id="pinDots"></div>
    <div class="pinerr" id="pinErr"></div>
    <div class="keypad" id="keypad"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <div class="drawer-scrim" id="scrim"></div>
  <div class="shell">
    <!-- sidebar -->
    <nav class="sidebar" id="sidebar"></nav>

    <div style="flex:1;min-width:0">
      <!-- appbar -->
      <header class="appbar">
        <button class="iconbtn menu-toggle" id="menuBtn" aria-label="মেনু">☰</button>
        <div class="logo"><img src="icon-64.png" alt="লোগো"></div>
        <div class="title">BS Dealer Pro<small id="bizName">ডিলারশিপ হিসাব</small></div>
        <div class="spacer"></div>
        <div class="profilechip">
          <span aria-hidden="true">👤</span>
          <select id="profileSelect" aria-label="প্রোফাইল"></select>
        </div>
        <button class="iconbtn" id="lockNowBtn" aria-label="লক">🔒</button>
      </header>

      <main class="content" id="view"></main>
    </div>
  </div>

  <!-- bottom nav -->
  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<!-- modal -->
<div class="modal-scrim" id="modalScrim">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ===================================================================
   BS Dealer Pro v4 — Offline Accounting PWA
   Single-file. Data in localStorage per profile.
=================================================================== */

/* ---------- tiny helpers ---------- */
const $=s=>document.querySelector(s);
const el=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==="class")e.className=a[k];else if(k==="html")e.innerHTML=a[k];else if(k.startsWith("on")&&typeof a[k]==="function")e.addEventListener(k.slice(2),a[k]);else if(a[k]!=null)e.setAttribute(k,a[k]);}for(const x of c.flat()){if(x==null||x===false)continue;e.append(x.nodeType?x:document.createTextNode(x));}return e;};
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const bn=n=>Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const taka=n=>"৳ "+bn(n);
const bnInt=n=>String(Math.round(Number(n||0))).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const fmtDate=iso=>{if(!iso)return"";const[y,m,d]=iso.split("-");if(!d)return iso;const mo=["জানু","ফেব","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্ট","অক্টো","নভে","ডিসে"];return bnInt(d)+" "+mo[+m-1]+" "+bnInt(y);};
const monthKey=iso=>(iso||"").slice(0,7);

let toastTimer;
function toast(msg,err){const t=$("#toast");t.textContent=msg;t.className="toast show"+(err?" err":"");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className="toast",2200);}

/* ---------- profiles ---------- */
const PKEY="bsdp4:profiles";
function loadProfiles(){
  let p=null;try{p=JSON.parse(localStorage.getItem(PKEY)||"null");}catch(e){}
  if(!p||!Array.isArray(p.list)||!p.list.length){const id="pf"+uid();p={list:[{id,name:"আমার ব্যবসা"}],current:id};localStorage.setItem(PKEY,JSON.stringify(p));}
  if(!p.list.find(x=>x.id===p.current))p.current=p.list[0].id;
  return p;
}
function saveProfiles(){localStorage.setItem(PKEY,JSON.stringify(PROFILES));}
let PROFILES=loadProfiles();

/* ---------- data store ---------- */
function dkey(){return "bsdp4:data:"+PROFILES.current;}
function fresh(){
  const cashId="acc_cash";
  return {
    meta:{business:"", pin:"", locked:false},
    accounts:[{id:cashId,name:"ক্যাশ (নগদ)",type:"cash"}],
    // ledger: every money movement. sign in +/- per account.
    ledger:[], // {id,date,ts,kind,account,dir:'in'|'out',amount,category,note,group,ref}
    incomeCats:["সার্ভিস চার্জ","কমিশন","পরিবহন আয়","ভাড়া আয়","অন্যান্য আয়"],
    expenseCats:["দোকান ভাড়া","বিদ্যুৎ বিল","কর্মচারী বেতন","পরিবহন","ইন্টারনেট/ফোন","চা-নাস্তা","অন্যান্য ব্যয়"],
    units:["পিস","কার্টন","কেজি","লিটার","ডজন","বস্তা"],
    products:[],
    parties:[],
    invoices:[],
    dues:[], // {id,date,partyId,party,dir:'receivable'|'payable',amount,paid,note,ref,history:[{date,amount,account,id}]}
    seq:1
  };
}
function loadData(){
  let d=null;try{d=JSON.parse(localStorage.getItem(dkey())||"null");}catch(e){}
  const f=fresh();
  if(!d||typeof d!=="object")return f;
  // shallow ensure keys
  for(const k in f)if(!(k in d))d[k]=f[k];
  if(!Array.isArray(d.accounts)||!d.accounts.length)d.accounts=f.accounts;
  return d;
}
let DB=loadData();
function save(){localStorage.setItem(dkey(),JSON.stringify(DB));render();}
function nextSeq(){DB.seq=(DB.seq||0)+1;return DB.seq;}

/* ---------- ledger / balances ---------- */
function accById(id){return DB.accounts.find(a=>a.id===id);}
function accName(id){const a=accById(id);return a?a.name:"—";}
function cashAcc(){return DB.accounts.find(a=>a.type==="cash")||DB.accounts[0];}
function bankAccs(){return DB.accounts.filter(a=>a.type==="bank");}
function accBalance(id){return DB.ledger.reduce((s,t)=>t.account===id?s+(t.dir==="in"?+t.amount:-t.amount):s,0);}
function totalCash(){return accBalance(cashAcc().id);}
function totalBank(){return bankAccs().reduce((s,a)=>s+accBalance(a.id),0);}

function post({date,kind,account,dir,amount,category,note,group,ref}){
  DB.ledger.push({id:uid(),date:date||todayISO(),ts:Date.now(),kind,account,dir,amount:Number(amount),category:category||"",note:note||"",group:group||"",ref:ref||""});
}
function removeGroup(group){DB.ledger=DB.ledger.filter(t=>t.group!==group);}
function removeLedgerId(id){DB.ledger=DB.ledger.filter(t=>t.id!==id);}

/* stock/product helpers */
function stockValue(){return DB.products.reduce((s,p)=>s+(+p.stock||0)*(+p.buy||0),0);}
function totalStockQty(){return DB.products.reduce((s,p)=>s+(+p.stock||0),0);}

/* dues */
function dueOutstanding(d){return Math.max(0,(+d.amount||0)-(+d.paid||0));}
function receivablesTotal(){return DB.dues.filter(d=>d.dir==="receivable").reduce((s,d)=>s+dueOutstanding(d),0);}
function payablesTotal(){return DB.dues.filter(d=>d.dir==="payable").reduce((s,d)=>s+dueOutstanding(d),0);}

/* P&L pieces */
function salesTotal(range){return DB.invoices.filter(i=>i.type==="sale"&&inRange(i.date,range)).reduce((s,i)=>s+(+i.total||0),0);}
function purchaseTotal(range){return DB.invoices.filter(i=>i.type==="purchase"&&inRange(i.date,range)).reduce((s,i)=>s+(+i.total||0),0);}
function cogsTotal(range){return DB.invoices.filter(i=>i.type==="sale"&&inRange(i.date,range)).reduce((s,i)=>s+i.items.reduce((a,it)=>a+(+it.qty||0)*(+it.buy||0),0),0);}
function ledgerSum(kind,range){return DB.ledger.filter(t=>t.kind===kind&&inRange(t.date,range)).reduce((s,t)=>s+(+t.amount||0),0);}
function inRange(iso,range){if(!range||(!range.from&&!range.to))return true;if(range.from&&iso<range.from)return false;if(range.to&&iso>range.to)return false;return true;}

/* transaction row */
function txRow(t){

  const title=t.category||(KIND_LABEL[t.kind]||"লেনদেন");

    acts.append(el("button",{title:"এডিট",onclick:()=>editLedger(t)},"✎"));
    acts.append(el("button",{title:"মুছুন",onclick:()=>delLedger(t)},"🗑"));
  }
  return el("div",{class:"trow"},
    el("div",{class:"ti "+cls},icon),
    el("div",{class:"tm"},el("div",{class:"tt"},title),el("div",{class:"ts"},meta)),
    el("div",{class:"ta"},
      el("div",{class:"amt "+(isTransfer?"":t.dir)},(t.dir==="in"?"+":"−")+taka(t.amount)),
      t.runbal!=null?el("div",{class:"bal"},"ব্যাল: "+taka(t.runbal)):null),
    acts);

  fg.append(fRow("তারিখ",f.date),fRow("খাত",f.cat),fRow("টাকার পরিমাণ",f.amt),fRow("যে হিসাবে",f.acc));

function tbl(headers,rows,footer){
  const w=el("div",{class:"tablewrap"});
  const t=el("table",{class:"tbl"});
  t.append(el("thead",{},el("tr",{},...headers.map((h,i)=>el("th",{class:i?"num":""},h)))));
  const tb=el("tbody",{});
  rows.forEach(r=>tb.append(el("tr",{},...r.map((c,i)=>el("td",{class:i?"num":""},c)))));
  t.append(tb);
  if(footer)t.append(el("tfoot",{},el("tr",{},...footer.map((c,i)=>el("td",{class:i?"num":""},c)))));
  w.append(t);return w;
}

    tbl(["বিবরণ","পরিমাণ"],[
      ["বিক্রয় (Revenue)",taka(sales)],

    ],["নীট লাভ / ক্ষতি",taka(net)])));

  // expense breakdown

  }

};

  });
  f.acc=sel({},bankAccs().map(b=>({v:b.id,t:b.name})));
  payAccWrap.append(el("label",{},"ব্যাংক অ্যাকাউন্ট"),f.acc);
  if(!bankAccs().length)f.acc.append(el("option",{value:""},"— কোনো ব্যাংক নেই —"));
  foot.append(el("label",{class:"field",style:"margin-bottom:6px"},"পেমেন্ট"),paySeg,payAccWrap);

  const totalsBox=el("div",{class:"mtop"});
  foot.append(totalsBox);
  foot.append(el("button",{class:"btn "+(isSale?"green":"primary")+" block mtop",onclick:saveInvoice},
    isSale?"বিক্রয় সেভ করুন":"ক্রয় সেভ করুন"));
  v.append(foot);

  function addToCart(p){
    const ex=cart.find(c=>c.pid===p.id);
    if(ex)ex.qty++;
    else cart.push({pid:p.id,name:p.name,qty:1,price:isSale?+p.sale:+p.buy,buy:+p.buy});
    drawCart();
  }
  function drawCart(){
    cartWrap.innerHTML="";
    if(!cart.length){cartWrap.append(emptyState("উপরের তালিকা থেকে পণ্য যোগ করুন","🛒"));drawTotals();return;}
    cart.forEach((c,i)=>{
      const row=el("div",{class:"trow"},
        el("div",{class:"tm"},el("div",{class:"tt"},esc(c.name)),
          el("div",{class:"ts"},taka(c.price)+" × "+bnInt(c.qty)+" = "+taka(c.price*c.qty))));
      const qtyBox=el("div",{style:"display:flex;align-items:center;gap:4px"});
      qtyBox.append(
        el("button",{class:"rowacts",style:"width:30px;height:30px;border-radius:9px;background:var(--panel);border:1px solid var(--line)",onclick:()=>{c.qty=Math.max(1,c.qty-1);drawCart();}},"−"),
        (()=>{const q=inp({type:"number",value:c.qty,style:"width:52px;padding:6px;text-align:center"});q.addEventListener("change",()=>{c.qty=Math.max(1,+q.value||1);drawCart();});return q;})(),
        el("button",{class:"rowacts",style:"width:30px;height:30px;border-radius:9px;background:var(--panel);border:1px solid var(--line)",onclick:()=>{c.qty++;drawCart();}},"＋"),
        el("button",{class:"rowacts",style:"width:30px;height:30px;border-radius:9px;background:var(--redbg);color:var(--red);border:1px solid var(--line)",onclick:()=>{cart.splice(i,1);drawCart();}},"🗑"));
      row.append(el("div",{class:"ta"},qtyBox));
      cartWrap.append(row);
    });
    drawTotals();
  }
  function drawTotals(){
    const sub=cart.reduce((s,c)=>s+c.price*c.qty,0);
    const disc=Math.min(sub,Math.max(0,+f.disc.value||0));
    const net=sub-disc;
    totalsBox.innerHTML="";
    totalsBox.append(el("div",{class:"rowbetween"},el("span",{class:"subtle"},"সাব-টোটাল"),el("b",{},taka(sub))));
    totalsBox.append(el("div",{class:"rowbetween mtop"},el("span",{class:"subtle"},"ডিসকাউন্ট"),el("b",{},"− "+taka(disc))));
    totalsBox.append(el("div",{class:"rowbetween mtop",style:"font-size:18px;border-top:1px dashed var(--line);padding-top:10px"},
      el("span",{},"সর্বমোট"),el("b",{style:"color:var(--brand2)"},taka(net))));
  }
  f.disc.addEventListener("input",drawTotals);

  function saveInvoice(){
    if(!cart.length)return toast("অন্তত একটি পণ্য যোগ করুন",1);
    const sub=cart.reduce((s,c)=>s+c.price*c.qty,0);
    const disc=Math.min(sub,Math.max(0,+f.disc.value||0));
    const net=sub-disc;
    if(f.pay==="bank"&&!f.acc.value)return toast("ব্যাংক অ্যাকাউন্ট যোগ করুন",1);
    const party=f.party.value.trim()||(isSale?"খুচরা গ্রাহক":"সরবরাহকারী");
    const group="inv"+uid();
    const invId="#"+nextSeq();
    const inv={id:invId,group,date:f.date.value,type,party,items:cart.map(c=>({pid:c.pid,name:c.name,qty:c.qty,price:c.price,buy:c.buy})),discount:disc,total:net,pay:f.pay,account:f.pay==="bank"?f.acc.value:(f.pay==="cash"?cashAcc().id:"")};
    DB.invoices.push(inv);
    // stock update
    cart.forEach(c=>{const p=DB.products.find(x=>x.id===c.pid);if(p)p.stock=(+p.stock||0)+(isSale?-c.qty:c.qty);});
    // money / due
    if(f.pay==="due"){
      DB.dues.push({id:"due"+uid(),date:f.date.value,partyId:"",party,dir:isSale?"receivable":"payable",amount:net,paid:0,note:invId+" ("+(isSale?"বিক্রয়":"ক্রয়")+")",ref:group,history:[]});
    }else{
      const acc=f.pay==="bank"?f.acc.value:cashAcc().id;
      post({date:f.date.value,kind:type,account:acc,dir:isSale?"in":"out",amount:net,category:(isSale?"বিক্রয় ":"ক্রয় ")+invId,note:party,group,ref:invId});
    }
    save();toast((isSale?"বিক্রয়":"ক্রয়")+" সেভ হয়েছে · "+invId);
    go(isSale?"dashboard":"dashboard");
  }
  drawPlist();drawCart();
}

    f.date=inp({type:"date",value:todayISO()});b.append(fRow("তারিখ",f.date));
    f.amt=inp({type:"number",inputmode:"decimal",value:out.toFixed(2)});b.append(fRow("পরিমাণ",f.amt));

      let amt=+f.amt.value;if(!(amt>0))return toast("সঠিক পরিমাণ দিন",1);

      post({date:f.date.value,kind:"due",account:f.acc.value,dir:d.dir==="receivable"?"in":"out",amount:amt,
        category:(d.dir==="receivable"?"বাকি আদায়":"বাকি পরিশোধ"),note:d.party,ref:"due:"+d.id+":"+pid,group:"due:"+d.id+":"+pid});

  removeGroup("due:"+d.id+":"+p.id);

}

    f.buy=inp({type:"number",inputmode:"decimal",value:p?.buy||0});
    f.margin=inp({type:"number",inputmode:"decimal",value:0,placeholder:"লাভ %"});
    f.sale=inp({type:"number",inputmode:"decimal",value:p?.sale||0});
    f.stock=inp({type:"number",inputmode:"decimal",value:p?.stock||0});
    f.low=inp({type:"number",inputmode:"decimal",value:p?.low||5});
    f.margin.addEventListener("input",()=>{const buy=+f.buy.value||0,m=+f.margin.value||0;if(m>0)f.sale.value=(buy*(1+m/100)).toFixed(2);});
    fg.append(el("div",{class:"field full"},el("label",{},"পণ্যের নাম"),f.name),
      fRow("ইউনিট",f.unit),fRow("ক্রয় দর",f.buy),
      fRow("লাভ (%)",f.margin),fRow("বিক্রয় দর",f.sale),
      fRow("বর্তমান স্টক",f.stock),fRow("লো-স্টক এলার্ট",f.low));
    b.append(fg);
    b.append(el("button",{class:"btn primary block mtop",onclick:()=>{
      const name=f.name.value.trim();if(!name)return toast("পণ্যের নাম দিন",1);
      const o={name,unit:f.unit.value,buy:+f.buy.value||0,sale:+f.sale.value||0,stock:+f.stock.value||0,low:+f.low.value||0};
      if(editing)Object.assign(p,o);else DB.products.push(Object.assign({id:"pr"+uid()},o));
      closeModal();save();toast("সংরক্ষিত");
    }},"সেভ করুন"));
    return b;
  });
}
function delProduct(p){confirmModal("'"+p.name+"' পণ্যটি মুছবেন?",()=>{DB.products=DB.products.filter(x=>x.id!==p.id);save();toast("মুছে ফেলা হয়েছে");});}

function partyModal(p){
  const editing=!!p;
  openModal(editing?"পার্টি এডিট":"নতুন পার্টি",()=>{
    const f={};const b=el("div",{});
    f.type=sel({},[{v:"customer",t:"গ্রাহক"},{v:"supplier",t:"সরবরাহকারী"}]);if(p?.type)f.type.value=p.type;
    f.name=inp({value:p?.name||"",placeholder:"নাম"});
    f.phone=inp({value:p?.phone||"",placeholder:"মোবাইল",inputmode:"tel"});
    f.address=inp({value:p?.address||"",placeholder:"ঠিকানা"});
    b.append(fRow("ধরন",f.type),fRow("নাম",f.name),fRow("মোবাইল",f.phone),fRow("ঠিকানা",f.address));
    b.append(el("button",{class:"btn primary block mtop",onclick:()=>{
      const name=f.name.value.trim();if(!name)return toast("নাম দিন",1);
      const o={type:f.type.value,name,phone:f.phone.value.trim(),address:f.address.value.trim()};
      if(editing)Object.assign(p,o);else DB.parties.push(Object.assign({id:"pt"+uid()},o));
      closeModal();save();toast("সংরক্ষিত");
    }},"সেভ করুন"));
    return b;
  });
}
function delParty(p){confirmModal("এই পার্টিটি মুছবেন?",()=>{DB.parties=DB.parties.filter(x=>x.id!==p.id);save();toast("মুছে ফেলা হয়েছে");});}

function delProfile(){
  if(PROFILES.list.length<=1)return toast("অন্তত ১টি প্রোফাইল থাকতে হবে",1);
  const cur=PROFILES.list.find(p=>p.id===PROFILES.current);
  confirmModal("'"+cur.name+"' প্রোফাইল ও এর সব ডেটা স্থায়ীভাবে মুছে যাবে। নিশ্চিত?",()=>{
    localStorage.removeItem(dkey());
    PROFILES.list=PROFILES.list.filter(p=>p.id!==PROFILES.current);
    PROFILES.current=PROFILES.list[0].id;saveProfiles();DB=loadData();UI.view="dashboard";render();toast("প্রোফাইল মুছে ফেলা হয়েছে");
  },"হ্যাঁ, ডিলিট");
}

/* ===================================================================
   BACKUP / CSV
=================================================================== */
function exportBackup(){
  const payload={app:"BS Dealer Pro",v:4,profile:PROFILES.list.find(p=>p.id===PROFILES.current).name,exportedAt:new Date().toISOString(),data:DB};
  downloadFile(JSON.stringify(payload,null,2),"bsdealerpro-backup-"+todayISO()+".json","application/json");
  toast("ব্যাকআপ ডাউনলোড হয়েছে");
}
function importBackup(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      const data=j.data||j;
      if(!data||typeof data!=="object"||!("ledger" in data)&&!("accounts" in data))throw 0;
      confirmModal("রিস্টোর করলে এই প্রোফাইলের বর্তমান ডেটা প্রতিস্থাপিত হবে। চালিয়ে যাবেন?",()=>{
        DB=Object.assign(fresh(),data);save();toast("রিস্টোর সম্পন্ন");go("dashboard");
      },"হ্যাঁ, রিস্টোর");
    }catch(err){toast("ফাইলটি সঠিক নয়",1);}
  };
  r.readAsText(file);e.target.value="";
}
function exportLedgerCSV(rows,title){
  const head=["তারিখ","ধরন","খাত","জমা","খরচ","হিসাব","বিবরণ"];
  const lines=[head.join(",")];
  rows.slice().reverse().forEach(t=>{
    lines.push([t.date,KIND_LABEL[t.kind]||t.kind,csv(t.category),t.dir==="in"?t.amount:"",t.dir==="out"?t.amount:"",csv(accName(t.account)),csv(t.note)].join(","));
  });
  downloadFile("\uFEFF"+lines.join("\n"),(title||"ledger")+"-"+todayISO()+".csv","text/csv");
  toast("CSV ডাউনলোড হয়েছে");
}
function csv(s){s=String(s==null?"":s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function downloadFile(content,name,type){
  const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);
  const a=el("a",{href:url,download:name});document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ===================================================================
   PIN LOCK
=================================================================== */
let pinState={mode:"unlock",buf:"",first:""};
function buildKeypad(){
  const k=$("#keypad");k.innerHTML="";
  ["১","২","৩","৪","৫","৬","৭","৮","৯","clr","০","del"].forEach(key=>{
    if(key==="clr")k.append(el("button",{class:"act",onclick:()=>{pinState.buf="";drawDots();}},"C"));
    else if(key==="del")k.append(el("button",{class:"act",onclick:()=>{pinState.buf=pinState.buf.slice(0,-1);drawDots();}},"⌫"));
    else k.append(el("button",{onclick:()=>pinPress(key)},key));
  });
}
function drawDots(){
  const d=$("#pinDots");d.innerHTML="";
  for(let i=0;i<4;i++)d.append(el("div",{class:"d"+(i<pinState.buf.length?" on":"")}));
}
const bn2en=s=>s.replace(/[০-৯]/g,c=>"০১২৩৪৫৬৭৮৯".indexOf(c));
function pinPress(key){
  if(pinState.buf.length>=4)return;
  pinState.buf+=bn2en(key);drawDots();
  if(pinState.buf.length===4)setTimeout(pinComplete,150);
}
function pinComplete(){
  const err=$("#pinErr");
  if(pinState.mode==="unlock"){
    if(pinState.buf===DB.meta.pin){unlockApp();}
    else{err.textContent="ভুল পিন, আবার চেষ্টা করুন";pinState.buf="";drawDots();}
  }else if(pinState.mode==="set"){
    pinState.first=pinState.buf;pinState.buf="";drawDots();
    $("#lockSub").textContent="আবার একই পিন দিন";pinState.mode="confirm";
  }else if(pinState.mode==="confirm"){
    if(pinState.buf===pinState.first){DB.meta.pin=pinState.buf;save();hideLock();toast("পিন সেট হয়েছে");}
    else{err.textContent="পিন মিলছে না, আবার দিন";pinState.buf="";pinState.first="";drawDots();$("#lockSub").textContent="নতুন পিন দিন";pinState.mode="set";}
  }
}
function showLock(mode){
  pinState={mode,buf:"",first:""};
  $("#pinErr").textContent="";
  $("#lockTitle").textContent=DB.meta.business||"BS Dealer Pro";
  $("#lockSub").textContent=mode==="set"?"নতুন পিন দিন":"পিন দিয়ে আনলক করুন";
  buildKeypad();drawDots();
  $("#lockScreen").classList.remove("hidden");
  $("#app").classList.add("hidden");
}
function hideLock(){$("#lockScreen").classList.add("hidden");$("#app").classList.remove("hidden");}
function unlockApp(){hideLock();render();}
function setupPin(){showLock("set");}
function lockNow(){if(DB.meta.pin)showLock("unlock");else toast("প্রথমে পিন সেট করুন (সেটিংস)",1);}

/* ===================================================================
   WIRE UP
=================================================================== */
$("#menuBtn").addEventListener("click",openDrawer);
$("#scrim").addEventListener("click",closeDrawer);
$("#lockNowBtn").addEventListener("click",lockNow);
$("#profileSelect").addEventListener("change",e=>{
  PROFILES.current=e.target.value;saveProfiles();DB=loadData();UI.view="dashboard";
  if(DB.meta.pin)showLock("unlock");else render();
});

/* boot */
function boot(){
  if(DB.meta.pin){showLock("unlock");}
  else{hideLock();render();}
}
boot();

/* service worker */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
