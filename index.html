<style>
:root{--pri:#7561ff;--pri2:#5f4bea;--bg:#f4f3fb;--card:#fff;--tx:#2b2a3a;--mut:#8a89a0;--line:#e2ddff;--red:#e53935;--grn:#16a34a;--org:#e08a00;--fab:#2b5fc7;--inp:#fff;--sh:0 2px 10px rgba(80,60,200,.10);--chip:#ece9ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141f;--card:#201f30;--tx:#eceaff;--mut:#9f9dbb;--line:#3a3762;--inp:#282740;--sh:0 2px 10px rgba(0,0,0,.4);--chip:#2d2b4d;--pri:#7d6bff}}
:root[data-theme="dark"]{--bg:#15141f;--card:#201f30;--tx:#eceaff;--mut:#9f9dbb;--line:#3a3762;--inp:#282740;--sh:0 2px 10px rgba(0,0,0,.4);--chip:#2d2b4d;--pri:#7d6bff}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:linear-gradient(to bottom,var(--pri) 0,var(--pri) env(safe-area-inset-top,0px),var(--bg) env(safe-area-inset-top,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Nunito','Hind Siliguri','Noto Sans Bengali','Kalpurush','Siyam Rupali',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}
button{font-family:inherit;cursor:pointer}
#shell{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;overflow:clip;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.12)}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
#ovl{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden;overflow:clip}
.ic{display:block;flex:none}
.hd{background:var(--pri);color:#fff;display:flex;align-items:center;gap:6px;padding:10px 10px 10px 8px;flex:none;min-height:60px}
.hd h1{font-size:19px;font-weight:700;margin:0 0 0 4px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .hl{width:34px;height:34px;border-radius:50%;background:#fff;flex:none;margin-left:2px}
.ib{background:none;border:0;color:inherit;padding:8px;border-radius:50%;display:grid;place-items:center;position:relative}
.ib:active{background:rgba(127,127,127,.2)}
.dot{position:absolute;top:7px;right:8px;width:10px;height:10px;border-radius:50%;background:#e53935;border:2px solid var(--pri)}
.ct{flex:1;overflow-y:auto;padding:14px 14px 100px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.mt{margin-top:12px}
.bal{background:linear-gradient(140deg,#6b57f2,#8c7cff);color:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 20px rgba(117,97,255,.35)}
.bal .bt{display:flex;justify-content:space-between;align-items:center;font-weight:600;opacity:.95}
.bal .bamt{font-size:32px;font-weight:800;margin:2px 0 0}
.bal .bsub{display:flex;gap:16px;font-size:13px;opacity:.9;margin-top:2px}
.bal .in{background:rgba(255,255,255,.18);border-radius:16px;padding:12px 14px;margin-top:14px;display:flex;justify-content:space-between;gap:10px}
.bal .in small{display:block;font-size:12px;opacity:.9}.bal .in b{font-size:19px}
.oc{display:flex;align-items:center;justify-content:space-between;border:2px solid;border-radius:18px;padding:16px;background:var(--card);margin-top:12px;cursor:pointer}
.oc small{display:block;color:var(--mut);font-weight:600}.oc b{font-size:22px}
.oc.cb{border-color:#8fb0ea}.oc.co{border-color:#efd39b}.oc.cp{border-color:#b7b0ee}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.qa{background:var(--card);border-radius:14px;padding:10px 2px;text-align:center;font-size:12px;font-weight:700;box-shadow:var(--sh);cursor:pointer}
.qa .ic{margin:0 auto 4px}
h2.st{font-size:16px;margin:20px 2px 8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer}
.av{width:40px;height:40px;border-radius:50%;background:var(--chip);color:var(--pri);display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.rm{flex:1;min-width:0}.rm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm small,.rr small{display:block;color:var(--mut);font-size:12.5px}
.rr{text-align:right;flex:none}.rr b{display:block}
.g{color:var(--grn)!important}.r{color:var(--red)!important}.o{color:var(--org)!important}
.em{text-align:center;color:var(--mut);padding:26px 10px;line-height:1.6}
.fab{position:absolute;right:16px;bottom:18px;background:var(--fab);color:#fff;border:0;border-radius:32px;padding:14px 22px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(43,95,199,.45);z-index:5}
.fg{margin-bottom:12px}
.fg label,.li label{display:block;font-size:12.5px;color:var(--mut);font-weight:700;margin-bottom:5px}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--inp);color:var(--tx);font:inherit;font-size:16px;min-width:0}
.inp:focus{outline:2px solid var(--pri);outline-offset:0;border-color:var(--pri)}
.inp.sm{padding:9px 10px}
textarea.inp{min-height:110px;resize:vertical}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;width:100%;display:block;text-align:center;text-decoration:none}
.btn.sec{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.red{background:var(--red)}
.btn+.btn{margin-top:10px}
.sv{position:sticky;bottom:0;padding:12px 0;background:linear-gradient(to bottom,transparent,var(--bg) 22%)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pr{display:flex;gap:6px;align-items:center}.pr .inp{flex:1}
.sq{color:var(--pri)}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:var(--sh)}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font-weight:700;color:var(--mut);font-size:14px}
.tabs .on{background:var(--pri);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 14px;font-weight:700;font-size:13px;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.sb{position:relative;margin-bottom:12px}.sb .ic{position:absolute;left:12px;top:12px}.sb .inp{padding-left:42px}
.sum{display:flex;justify-content:space-between;align-items:center;background:var(--chip);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:700}
.sh2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.li{border:1.5px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.lh{display:flex;justify-content:space-between;align-items:center;gap:6px}
.lg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-top:6px}
.lt{text-align:right}.lt b{display:block;padding:9px 0}
.sr{display:flex;justify-content:space-between;padding:6px 0;gap:10px}
.sr.big{font-size:18px;font-weight:800;border-top:1.5px dashed var(--line);margin-top:4px;padding-top:10px}
.tw{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th,.tb td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tb th{color:var(--mut);font-weight:700}.tb .n{text-align:right;white-space:nowrap}
.tb tfoot td{font-weight:800}
.receipt{text-align:left}
.receipt h2{margin:0;text-align:center;font-size:20px}.receipt .rc{text-align:center;color:var(--mut);margin-bottom:10px}
.receipt .rlogo{display:block;width:64px;height:64px;margin:0 auto 6px;border-radius:50%}
.rhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}.rhead img{width:42px;height:42px;border-radius:50%}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.acts .btn+.btn{margin:0}
.rep{display:flex;align-items:center;gap:14px}
.rep b{display:block}.rep small{color:var(--mut)}
.faq{border-bottom:1px solid var(--line);padding:10px 0}.faq summary{font-weight:700;cursor:pointer}.faq p{margin:8px 0 0;color:var(--mut);line-height:1.6}
.bcg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bcl{background:#fff;color:#000;border:1px dashed #bbb;border-radius:6px;padding:6px;text-align:center;font-size:11px;overflow:hidden}
.bcl b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{width:100%;height:42px;display:block;margin:4px 0}
.lgb{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:20px;padding:7px 14px;font-weight:700;font-size:13px}
/* drawer */
#dov{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
#dov.on{opacity:1;pointer-events:auto}
#dr{position:absolute;top:0;bottom:0;left:0;width:79%;max-width:380px;background:var(--card);transform:translateX(-102%);transition:transform .28s ease;display:flex;flex-direction:column;pointer-events:auto;padding-top:env(safe-area-inset-top,0px)}
#dr.on{transform:none}
.dh{position:relative;background:var(--pri);color:#fff;text-align:center;padding:18px 14px 20px;flex:none;margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(18px + env(safe-area-inset-top,0px))}
.dh .lgb{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top,0px))}
.dav{position:relative;width:84px;height:84px;margin:0 auto 8px}
.dav>.pic{width:84px;height:84px;border-radius:50%;overflow:hidden;background:#fff;border:3px solid rgba(255,255,255,.7)}
.dav img{width:100%;height:100%;object-fit:cover;display:block}
.dav .ed{position:absolute;right:-8px;bottom:0;width:34px;height:34px;border-radius:50%;background:#fff;border:0;display:grid;place-items:center;color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.dh .nm{font-size:22px;font-weight:800;letter-spacing:.3px}.dh .ph{font-size:18px;margin:2px 0 12px}
.stp{background:#fff;color:var(--pri);border:0;border-radius:30px;padding:13px 26px;font-size:20px;font-weight:800;font-style:italic;display:inline-flex;align-items:center;gap:12px;max-width:100%}
.stp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dm{flex:1;overflow-y:auto;padding:6px 0}
.mi{display:flex;align-items:center;gap:16px;padding:14px 18px;font-size:17px;cursor:pointer}
.mi span{flex:1}.mi.red{color:var(--red)}
.mi:active,.si:active{background:var(--chip)}
.si{display:flex;align-items:center;gap:16px;padding:12px 14px 12px 34px;font-size:17px;cursor:pointer}
.si span{flex:1}
.pl{background:none;border:0;padding:4px;display:grid;place-items:center}
.dv{border-top:1.6px dashed var(--line);margin:8px 26px;width:74%}
.df{flex:none;border-top:1.6px dashed var(--line);padding:12px 20px 0;margin:0 8px}
.pk{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pk small{display:block;color:var(--mut);font-size:15px}.pk b{font-size:16px}
.sub{background:var(--pri);color:#fff;border:0;border-radius:30px;padding:13px 24px;font-size:17px;font-weight:600;white-space:nowrap}
.dv2{border-top:1.6px dashed var(--line);margin:12px 0 0}
.br{display:flex;justify-content:space-between;align-items:center;padding:10px 0 14px;color:var(--mut)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;color:var(--pri)}
.brand img{width:40px;height:40px;border-radius:50%}
/* sheet */
#sov{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
#sov.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;max-height:88%;overflow-y:auto;transform:translateY(105%);transition:transform .25s;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));pointer-events:auto}
#sheet.on{transform:none}
#sheet h3{margin:0 0 12px;font-size:18px}
#toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,20px);background:#2a2a35;color:#fff;padding:10px 18px;border-radius:22px;opacity:0;transition:.25s;max-width:88%;text-align:center;font-size:14px;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* POS split layout: products left, invoice right */
#shell.wide{max-width:1100px}
.ct.pos{padding:0;overflow:hidden;display:flex;flex-direction:column}
.pos-wrap{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,42%) minmax(0,58%)}
.pos-l,.pos-r{overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch;min-width:0}
.pos-l{border-right:1.5px solid var(--line)}
.pos-r .card{padding:10px}
.pos-r .fg{margin-bottom:8px}
.pos-r .sr{font-size:14px}.pos-r .sr.big{font-size:16px}
.pbar{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.pbar .sb{margin:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding-top:6px}
.pc{position:relative;background:var(--card);border-radius:12px;padding:10px;box-shadow:var(--sh);cursor:pointer;min-width:0;user-select:none}
.pc:active{transform:scale(.97)}
.pc b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;line-height:1.3;min-height:35px}
.pc .pr2{color:var(--pri);font-weight:800;margin-top:4px}
.pc small{display:block;color:var(--mut);font-size:11.5px}
.bd{position:absolute;top:-6px;right:-6px;background:var(--grn);color:#fff;border-radius:12px;min-width:22px;height:22px;display:none;place-items:center;font-size:12px;font-weight:800;padding:0 6px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.bd.on{display:grid}
.qs{display:grid;grid-template-columns:36px 1fr 36px;gap:6px;margin:6px 0}
.qb{border:1.5px solid var(--line);background:var(--card);color:var(--pri);border-radius:10px;font-size:20px;font-weight:800;line-height:1}
.qs .inp{text-align:center;padding:8px 4px;-moz-appearance:textfield}
.qs .inp::-webkit-inner-spin-button,.qs .inp::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pp{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.pos-r .li{padding:8px}
.pos-r .sv{background:var(--bg);margin:0 -10px -10px;padding:10px}
@media (min-width:700px){.pos-wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pos-l,.pos-r{padding:14px}}
/* auth */
.au{position:relative;flex:1;overflow-y:auto;background:linear-gradient(180deg,var(--pri) 0,var(--pri) 250px,var(--bg) 250px);padding:34px 18px 30px}
.au .lgb{position:absolute;right:14px;top:14px}
.au .top{color:#fff;text-align:center;margin-bottom:22px}
.au .top img{width:116px;height:116px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.85);box-shadow:0 8px 22px rgba(0,0,0,.25)}
.au .top .nm{display:block;font-size:30px;font-weight:800;margin-top:8px}
.au .top p{margin:4px 0 0;opacity:.92}
.au .card{padding:20px}
.au h3{margin:0 0 14px;font-size:20px}
.mut{color:var(--mut);font-size:13px;line-height:1.55}
/* splash */
#splash{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:opacity .45s;color:var(--tx)}
#splash img{width:150px;height:150px;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.18)}
#splash b{font-size:26px;margin-top:10px;color:var(--pri)}#splash span{color:var(--mut);font-size:14px}
@media print{
 body *{visibility:hidden}
 .pa,.pa *{visibility:visible}
 .pa{position:absolute;left:0;top:0;width:100%;box-shadow:none!important;color:#000}
 #shell{overflow:visible;box-shadow:none;height:auto}
 #ovl{display:none}
 #app,.ct{position:static!important;overflow:visible!important;height:auto!important;display:block!important}
 html,body{height:auto!important;background:#fff!important}
}
</style>

const isTx=k=>!!INV[k]||TXK.indexOf(k)>=0;
const FK={parties:'party',products:'product',cats:'cat',units:'unit',expcats:'expcat',banks:'bank'};
const COLL={parties:'parties',products:'products',cats:'cats',units:'units',expcats:'expCats',banks:'banks'};
const cost=x=>(x.items||[]).reduce((s,i)=>s+num(i.qty)*num(i.cost),0);
const nameOf=(arr,id)=>{const r=arr.find(z=>z.id===id);return r?r.name:''};
const pname=id=>nameOf(db.parties,id)||tr('Walk-in');

function flowsOf(t){
 const m=t.mode||'cash';
 switch(t.type){
  case 'sale':case 'purchase_return':return [[m,num(t.paid)]];
  case 'sale_return':case 'purchase':return [[m,-num(t.paid)]];
  case 'pay_in':return [[m,num(t.amount)]];
  case 'pay_out':case 'expense':return [[m,-num(t.amount)]];
  case 'cash_adj':return [['cash',t.dir==='in'?num(t.amount):-num(t.amount)]];
  case 'bank_tx':return t.dir==='deposit'?[['cash',-num(t.amount)],[t.bank,num(t.amount)]]:[['cash',num(t.amount)],[t.bank,-num(t.amount)]];
 }
 return [];
}
function pd(t){
 switch(t.type){
  case 'sale':case 'purchase_return':return num(t.total)-num(t.paid);
  case 'sale_return':case 'purchase':return -(num(t.total)-num(t.paid));
  case 'pay_in':return -num(t.amount);
  case 'pay_out':return num(t.amount);
 }
 return 0;
}
function calc(){
 const c={cash:0,bank:{},party:{},stock:{}};
 db.banks.forEach(b=>c.bank[b.id]=num(b.open));
 db.parties.forEach(p=>c.party[p.id]=(p.oty==='pay'?-1:1)*num(p.open));
 db.products.forEach(p=>c.stock[p.id]=num(p.stock));
 for(const t of db.tx){
  for(const f of flowsOf(t)){if(f[0]!=='cash'&&f[0] in c.bank)c.bank[f[0]]+=f[1];else c.cash+=f[1]}
  if(t.party in c.party)c.party[t.party]+=pd(t);
  let sg=0;
  if(t.type==='sale'||t.type==='purchase_return')sg=-1;
  else if(t.type==='sale_return'||t.type==='purchase')sg=1;
  if(sg&&t.items)for(const i of t.items)if(i.pid in c.stock)c.stock[i.pid]+=sg*num(i.qty);
  if(t.type==='stock_adj'&&t.pid in c.stock)c.stock[t.pid]+=(t.dir==='add'?1:-1)*num(t.qty);
 }
 return c;
}
function rng(p){
 const d=new Date(),t=ymd(d);
 if(p==='today')return[t,t];
 if(p==='week'){const s=new Date(d);s.setDate(s.getDate()-6);return[ymd(s),t]}
 if(p==='month')return[ymd(new Date(d.getFullYear(),d.getMonth(),1)),t];
 if(p==='year')return[d.getFullYear()+'-01-01',t];
 return['0000-00-00','9999-12-31'];
}
const PL={today:'Today',week:'Last 7 Days',month:'This Month',year:'This Year',all:'All Time'};
const PLA={today:"Today's",week:'7-day',month:"This month's",year:"This year's",all:'All-time'};
function metrics(f,t){
 const m={sale:0,sret:0,pur:0,pret:0,cogs:0,exp:0};
 for(const x of db.tx){
  if(x.date<f||x.date>t)continue;
  if(x.type==='sale'){m.sale+=x.total;m.cogs+=cost(x)}
  else if(x.type==='sale_return'){m.sret+=x.total;m.cogs-=cost(x)}
  else if(x.type==='purchase')m.pur+=x.total;
  else if(x.type==='purchase_return')m.pret+=x.total;
  else if(x.type==='expense')m.exp+=num(x.amount);
 }
 m.net=m.sale-m.sret;m.gp=m.net-m.cogs;m.np=m.gp-m.exp;
 return m;
}
const thr=p=>num(p.low)>0?num(p.low):num(db.set.low);
function alerts(){
 if(!db)return[];
 const c=calc(),a=[];
 db.products.forEach(p=>{if(thr(p)>0&&c.stock[p.id]<=thr(p))a.push({i:'product',t:tr('{0} — low stock ({1} left)',p.name,fmt(c.stock[p.id])),r:'list',k:'products'})});
 db.parties.forEach(p=>{const b=c.party[p.id];if(b>0.004)a.push({i:'due',t:tr('{0} owes you {1}',p.name,cur(b)),r:'party',id:p.id})});
 return a;
}
function nextNo(type){
 db.seq[type]=(db.seq[type]||0)+1;
 return INV[type].p+'-'+String(db.seq[type]).padStart(4,'0');
}

 }
 if(r==='stock'){

/* ---------- barcode ---------- */
const C39={'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn','A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn','F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn','K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn','P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn','U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn','Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','*':'nwnnwnwnn'};
function c39(text){
 const s='*'+String(text).toUpperCase().replace(/[^0-9A-Z\-\. ]/g,'-')+'*';
 let x=0,bars='';
 for(const ch of s){const pt=C39[ch];for(let i=0;i<9;i++){const w=pt[i]==='w'?5:2;if(i%2===0)bars+='<rect x="'+x+'" y="0" width="'+w+'" height="50"/>';x+=w}x+=2}
 return '<svg class="bar" viewBox="0 0 '+(x-2)+' 50" preserveAspectRatio="none"><g fill="#000">'+bars+'</g></svg>';
}
function bcBody(){
 const b=S.bc,p=db.products.find(z=>z.id===b.pid);
 const code=p?(p.barcode||''):b.text.trim();
 if(!code)return '<p class="em">'+tr('Choose a product or type a code to see the labels.')+'</p>';
 const n=Math.max(1,Math.min(60,Math.floor(num(b.copies))||1));
 const one='<div class="bcl">'+(p?'<b>'+esc(p.name)+'</b>':'')+c39(code)+'<span>'+esc(code)+'</span>'+(p&&b.price?'<b>'+cur(p.sell)+'</b>':'')+'</div>';
 return '<div class="bcg">'+new Array(n+1).join(one)+'</div>';
}

 +'<p class="mut">'+tr('Items at or below their low-stock level are listed for you. WhatsApp uses +88 for numbers that start with 0.')+'</p></div>';
 return{t:tr('Purchase Message'),h:h,after:msgLinks};
};
ACT.copymsg=()=>copyText($('#mT').value);

/* ---------- utility / misc pages ---------- */
VIEWS.reset=()=>({t:tr('Reset Account'),h:'<div class="card"><b>'+tr('Delete all data in “{0}”',esc(storeName()))+'</b><p class="mut">'+tr('This removes every product, party, invoice, payment and expense in this store and cannot be undone. Your login and your other stores are not touched. Copy a backup from Settings first if you might need the data.')+'</p><div class="fg"><label>'+tr('Type RESET to confirm')+'</label><input class="inp" id="rsT" autocapitalize="characters"></div><button class="btn red" data-a="doreset">'+tr('Reset this store')+'</button></div>'});
ACT.doreset=()=>{
 if($('#rsT').value.trim()!=='RESET')return toast('Type RESET in capital letters to confirm');
 db=newDB();saveDB();S.stack=[];S.route='home';S.p={};render();toast('Store data cleared');
};
VIEWS.refer=()=>{
 const code='BDC'+String(meta.user.phone).replace(/\D/g,'').slice(-4);
 return{t:tr('Refer and Earn'),h:'<div class="card" style="text-align:center"><div style="margin:6px auto">'+ic('refer',54)+'</div><b style="font-size:18px">'+tr('Invite a friend')+'</b><p class="mut">'+tr('Share BDC PRO with other shop owners. Rewards are not tracked in this offline version.')+'</p><div class="sum" style="justify-content:center;font-size:24px;letter-spacing:3px">'+code+'</div><button class="btn" data-a="sharecode" data-c="'+code+'">'+tr('Share invite')+'</button></div>'};
};
ACT.sharecode=d=>{const t=tr('Try BDC PRO for shop accounts and stock. My invite code: {0}',d.c);if(navigator.share){navigator.share({text:t}).catch(()=>{})}else copyText(t)};
VIEWS.subscription=()=>({t:tr('Subscription'),h:'<div class="card"><small class="mut">'+tr('Current package')+'</small><div style="font-size:24px;font-weight:800">'+tr('Basic')+'</div><p class="mut">'+tr('Included: unlimited sales, purchases, products and parties, bank accounts, reports, barcode labels and multiple stores on this device.')+'</p><button class="btn" data-a="subs">'+tr('Subscribe')+'</button></div><p class="mut" style="padding:0 6px">'+tr('Paid plans are not available in this offline version — everything above is already yours.')+'</p>'});
ACT.subs=()=>toast('Paid plans are not available in this offline version');
VIEWS.help=()=>({t:tr('Help and Support'),h:'<div class="card">'+FAQ[LANG].map(q=>'<details class="faq"><summary>'+q[0]+'</summary><p>'+q[1]+'</p></details>').join('')+'</div>'});
VIEWS.tutorial=()=>({t:tr('Tutorial Video'),h:'<p class="mut" style="margin:0 4px 10px">'+tr('Step-by-step guides instead of videos — tap one.')+'</p>'+TUT[LANG].map((t,i)=>'<div class="row rep" data-a="tut" data-i="'+i+'">'+ic('tut',30)+'<div class="rm"><b>'+t[0]+'</b><small>'+tr('{0} steps',fmt(t[1].length))+'</small></div>'+ic('right',20,'#8a89a0')+'</div>').join('')});
ACT.tut=d=>{const t=TUT[LANG][+d.i];sheet('<h3>'+t[0]+'</h3><ol style="padding-left:22px;line-height:1.9">'+t[1].map(s=>'<li>'+s+'</li>').join('')+'</ol><button class="btn" data-a="closesheet">'+tr('Got it')+'</button>')};

/* ---------- settings ---------- */
VIEWS.settings=()=>{
 const u=meta.user,st=db.set;
 const bk=JSON.stringify({app:'bdcpro',v:1,store:storeName(),db:db});
 const opt=(a,cur2)=>a.map(o=>'<option value="'+o[0]+'"'+(cur2===o[0]?' selected':'')+'>'+o[1]+'</option>').join('');
 const h='<div class="card"><b>'+tr('Profile')+'</b><div class="fg mt"><label>'+tr('Your name')+'</label><input class="inp" id="stName" value="'+esc(u.name)+'"></div><div class="fg"><label>'+tr('Phone number')+'</label><input class="inp" id="stPhone" type="tel" value="'+esc(u.phone)+'"></div><div class="fg"><label>'+tr('New password (leave blank to keep)')+'</label><input class="inp" id="stPass" type="password" autocomplete="new-password"></div></div>'
 +'<div class="card mt"><b>'+tr('Store')+'</b><div class="fg mt"><label>'+tr('Store name')+'</label><input class="inp" id="stStore" value="'+esc(storeName())+'"></div><div class="two"><div class="fg"><label>'+tr('Currency')+'</label><input class="inp" id="stCur" value="'+esc(st.cur)+'"></div><div class="fg"><label>'+tr('Default low-stock level')+'</label><input class="inp" id="stLow" type="number" value="'+st.low+'"></div></div><div class="fg"><label>'+tr('Invoice footer')+'</label><input class="inp" id="stNote" value="'+esc(noteTxt(st.note))+'"></div>'
 +'<div class="two"><div class="fg"><label>'+tr('Language')+'</label><select class="inp" id="stLang">'+opt([['bn','বাংলা'],['en','English']],LANG)+'</select></div><div class="fg"><label>'+tr('Appearance')+'</label><select class="inp" id="stTheme">'+opt([['auto',tr('Match my phone')],['light',tr('Light')],['dark',tr('Dark')]],meta.theme)+'</select></div></div></div>'
 +'<div class="sv" style="position:static;padding-bottom:0"><button class="btn mt" data-a="savesettings">'+tr('Save settings')+'</button></div>'
 +'<div class="card mt"><b>'+tr('Backup')+'</b><p class="mut">'+tr('Copy this text and keep it safe. To restore, paste it here and tap Restore. Restoring replaces this store’s data.')+'</p><textarea class="inp" id="bkT">'+esc(bk)+'</textarea><div class="two mt"><button class="btn sec" data-a="copybk">'+tr('Copy')+'</button><button class="btn sec" data-a="restore">'+tr('Restore')+'</button></div></div>';
 return{t:tr('Settings'),h:h};
};
ACT.savesettings=()=>{
 const n=$('#stName').value.trim(),ph=$('#stPhone').value.trim(),pw=$('#stPass').value,sn=$('#stStore').value.trim();
 if(!n||!ph||!sn)return toast('Name, phone and store name can’t be empty');
 if(pw&&pw.length<4)return toast('Password needs at least 4 characters');
 meta.user.name=n;meta.user.phone=ph;if(pw)meta.user.pass=pw;
 meta.stores.find(s=>s.id===meta.cur).name=sn;
 db.set.cur=$('#stCur').value.trim()||'Tk';db.set.low=num($('#stLow').value);
 const nt=$('#stNote').value.trim();db.set.note=(nt===noteTxt(DEFNOTE)||nt==='')?DEFNOTE:nt;
 meta.theme=$('#stTheme').value;applyTheme();
 const nl=$('#stLang').value;meta.lang=nl;LANG=nl;document.documentElement.lang=nl;
 saveMeta();saveDB();render();toast('Settings saved');
};
ACT.copybk=()=>{const e=$('#bkT');copyText(e.value);try{e.select()}catch(x){}};
ACT.restore=()=>{
 let o;try{o=JSON.parse($('#bkT').value)}catch(e){return toast('That text is not a valid backup')}
 if(!o||o.app!=='bdcpro'||!o.db||!Array.isArray(o.db.tx))return toast('That text is not a BDC PRO backup');
 ask('Replace this store’s data with the backup?',()=>{db=o.db;saveDB();render();toast('Backup restored')},'Restore');
};

/* ---------- global events ---------- */
$('#shell').addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el)return;
 const f=ACT[el.dataset.a];
 if(f){e.preventDefault();f(el.dataset,el)}
});
document.addEventListener('input',e=>{
 const t=e.target,id=t.id;
 if(id==='q'){S.q=t.value;if(S.refresh)S.refresh();return}
 if(id==='pq'){S.pq=t.value;$('#pl').innerHTML=pickHTML();return}
 if(id==='pq2'){S.pq=t.value;$('#pList').innerHTML=prodCards();syncBadges();return}
 if(t.dataset&&t.dataset.li!==undefined&&S.inv){S.inv.items[+t.dataset.li][t.dataset.f]=num(t.value);refreshTot();return}
 if(S.route==='barcode'&&(id==='bcT'||id==='bcN')){if(id==='bcT')S.bc.text=t.value;else S.bc.copies=t.value;$('#bcO').innerHTML=bcBody();return}
 if(S.route==='message'&&id==='mT'){msgLinks();return}
 if(!S.inv||S.route!=='inv')return;
 if(id==='iDisc'){S.inv.disc=num(t.value);refreshTot()}
 else if(id==='iPaid'){S.inv.paid=num(t.value);S.paidTouched=true;refreshTot()}
 else if(id==='iNote')S.inv.note=t.value;
});
document.addEventListener('change',e=>{
 const t=e.target,id=t.id;
 if(id==='avIn'){
  const file=t.files&&t.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{
   const s=160,c=document.createElement('canvas');c.width=c.height=s;
   const m=Math.min(im.width,im.height),cx=c.getContext('2d');
   cx.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);
   meta.user.avatar=c.toDataURL('image/jpeg',.85);saveMeta();renderDrawer();toast('Profile photo updated');
  };im.src=rd.result};
  rd.readAsDataURL(file);t.value='';return;
 }
 if(S.route==='inv'&&S.inv){
  if(id==='iDate')S.inv.date=t.value;
  else if(id==='iParty')S.inv.party=t.value;
  else if(id==='iMode')S.inv.mode=t.value;
 }
 if(S.route==='report'&&(id==='rf'||id==='rt')){S.rp='custom';S.rf=$('#rf').value;S.rt=$('#rt').value;render()}
 if(S.route==='barcode'){
  if(id==='bcP'){S.bc.pid=t.value}else if(id==='bcT'){S.bc.text=t.value}else if(id==='bcN'){S.bc.copies=t.value}else if(id==='bcS'){S.bc.price=t.value==='1'}else return;
  $('#bcO').innerHTML=bcBody();
 }
 if(S.route==='message'&&(id==='mP'||id==='mT'))msgLinks();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!meta.auth&&meta.user&&e.target.id==='lPass')ACT.login();
 if(e.key==='Enter'&&e.target.id==='pq2'){e.preventDefault();addByCode()}
});

document.documentElement.lang=LANG;
applyTheme();
render();
setTimeout(()=>{const s=$('#splash');if(!s)return;s.style.opacity='0';setTimeout(()=>s.remove(),500)},900);
})();
</script>
</body>
</html>
